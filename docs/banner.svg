<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E9BF5"/>
      <stop offset="1" stop-color="#8E6BE0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E9BF5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6E9BF5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6E9BF5" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ln { opacity: 0; animation: rise .45s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .d2{animation-delay:.5s}.d3{animation-delay:.95s}.d4{animation-delay:1.4s}.d5{animation-delay:1.85s}
      .d6{animation-delay:2.3s}.d7{animation-delay:2.75s}.d8{animation-delay:3.2s}
      .cur{animation:blink 1s steps(1) infinite;animation-delay:3.6s}
      @keyframes blink{50%{opacity:0}}
      .sweep{animation:sweep 3.4s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-120px)}50%{transform:translateX(640px)}100%{transform:translateX(-120px)}}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.45}}
      text{font-size:15px}
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="340" rx="14" fill="#0A0C10"/>
  <rect x="24" y="24" width="712" height="292" rx="11" fill="#0E1117" stroke="#252A34"/>

  <g transform="translate(44,52)">
    <circle cx="0" cy="0" r="5.5" fill="#E26D63"/>
    <circle cx="20" cy="0" r="5.5" fill="#D9B65A"/>
    <circle cx="40" cy="0" r="5.5" fill="#4FB286"/>
    <rect x="300" y="-9" width="18" height="18" rx="5" fill="url(#logo)"/>
    <text x="326" y="5" fill="#C3C8D1" font-weight="700">prowlscanner</text>
  </g>

  <line x1="24" y1="76" x2="736" y2="76" stroke="#252A34"/>

  <rect class="sweep" x="24" y="77" width="120" height="238" fill="url(#beam)"/>

  <g transform="translate(48,112)" fill="#E8EAEE">
    <text class="ln d2" y="0"><tspan fill="#4FB286">$</tspan> <tspan fill="#C3C8D1">prowlscanner</tspan> <tspan fill="#9FBEFA">*.example.com</tspan> <tspan fill="#5B6472">--authorize</tspan></text>
    <text class="ln d3" y="34" fill="#6AA9E0">[RECON]  resolved api.example.com -&gt; 203.0.113.10</text>
    <text class="ln d4" y="64" fill="#8B93A1">[CRAWL]  48 endpoints · 27 parameters mapped</text>
    <text class="ln d5" y="98"><tspan fill="#8B93A1">[SCAN]   </tspan><tspan fill="#E26D63" font-weight="700" class="pulse">✗ P1</tspan><tspan fill="#E8EAEE">  SQL injection      /listproducts?cat=1'</tspan></text>
    <text class="ln d6" y="128"><tspan fill="#8B93A1">         </tspan><tspan fill="#D9B65A" font-weight="700">✗ P3</tspan><tspan fill="#E8EAEE">  Reflected XSS      /search?q=</tspan></text>
    <text class="ln d7" y="158"><tspan fill="#8B93A1">         </tspan><tspan fill="#6AA9E0" font-weight="700">✗ P4</tspan><tspan fill="#E8EAEE">  Open redirect      /go?next=</tspan></text>
    <text class="ln d8" y="192"><tspan fill="#4FB286">[REPORT] 3 findings · VRT-mapped · P1–P4</tspan> <tspan class="cur" fill="#6E9BF5">▋</tspan></text>
  </g>
</svg>
